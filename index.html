<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BankAssist Utility</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0f172a;           /* slate-900 */
      --panel:#111827;        /* gray-900 */
      --panel-2:#0b1220;      /* deep panel */
      --text:#e5e7eb;         /* gray-200 */
      --muted:#9ca3af;        /* gray-400 */
      --brand:#3b82f6;        /* blue-500 */
      --brand-2:#2563eb;      /* blue-600 */
      --accent:#22d3ee;       /* cyan-400 */
      --ok:#10b981;           /* emerald-500 */
      --warn:#f59e0b;         /* amber-500 */
      --error:#ef4444;        /* red-500 */
      --border:#1f2937;       /* gray-800 */
      --code-bg:#0b1220;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, #0b2a37 0%, var(--bg) 45%) fixed,
                  linear-gradient(180deg, var(--bg), #0b1220);
      color: var(--text);
      min-height:100vh;
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: saturate(120%) blur(8px);
      background: rgba(8,11,21,.6);
      border-bottom:1px solid var(--border);
    }
    .header-compact {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px;
}
.nav-inline {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tab-btn {
  padding: 6px 10px;
  font-size: 13px;
}
.api-key-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.api-key-input {
  width: 180px;
  padding: 4px 6px;
  font-size: 12px;
}
.api-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

    .container{max-width:1200px; margin:0 auto; padding:18px 20px;}
    .header-top{
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
    }
    .brand{
      display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.3px;
    }
    .dot{
      width:12px; height:12px; border-radius:50%;
      background: conic-gradient(from 180deg at 50% 50%, var(--accent), var(--brand), var(--accent));
      box-shadow:0 0 18px var(--accent);
    }
    .api-key-section{
      display:flex; align-items:center; gap:8px; flex-shrink:0;
    }
    .api-key-label{
      font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap;
    }
    .api-key-input{
      width:300px; max-width:40vw; color:#eaf2ff;
      background: #0a1020; border:1px solid #1a2744; border-radius:8px;
      padding:8px 10px; outline:none; font-size:12px;
      transition:border-color .15s ease, box-shadow .15s ease;
      box-shadow: inset 0 0 0 1px rgba(59,130,246,.06);
    }
    .api-key-input:focus{
      border-color:#2c5fb9; box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }
    .api-key-input::placeholder{color:#4b5563}
    .api-status{
      width:8px; height:8px; border-radius:50%; transition: background-color .2s ease;
    }
    .api-status.empty{background:#ef4444}
    .api-status.filled{background:#10b981}
    
    nav{
      margin-top:14px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    }
    .tab-btn{
      appearance:none; border:1px solid var(--border);
      background: linear-gradient(180deg, #0f1a2e, #0b1220);
      color:var(--text); padding:10px 14px; border-radius:10px; cursor:pointer;
      transition:.2s ease; font-weight:600;
    }
    .tab-btn:hover{border-color:#274472; transform: translateY(-1px)}
    .tab-btn.active{
      background: linear-gradient(180deg, #13315c, #102544);
      border-color:#2a5fa6; box-shadow:0 0 0 3px rgba(59,130,246,.15) inset;
    }
    main{padding:20px}
    .grid{display:grid; grid-template-columns: 1.05fr .95fr; gap:18px}
    @media (max-width: 1024px){ 
      .grid{grid-template-columns:1fr}
      .header-top{flex-direction:column; align-items:flex-start}
      .api-key-input{width:250px; max-width:80vw}
    }

    .panel{
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border:1px solid var(--border);
      border-radius:14px; overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
    }
    .panel header{
      position:relative;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
      padding:14px 16px; border-bottom:1px solid var(--border);
    }
    .panel header h2{
      margin:0; font-size:16px; font-weight:800; letter-spacing:.4px; color:#e9edf8;
      text-transform:uppercase;
    }
    .panel .body{padding:16px}
    label{display:block; font-size:12px; color:var(--muted); margin:12px 0 6px 2px; font-weight:700; letter-spacing:.2px}
    textarea, input{
      width:100%; color:#eaf2ff;
      background: #0a1020; border:1px solid #1a2744; border-radius:10px;
      padding:10px 12px; outline:none; resize:vertical; min-height:44px;
      transition:border-color .15s ease, box-shadow .15s ease;
      box-shadow: inset 0 0 0 1px rgba(59,130,246,.06), 0 8px 20px rgba(0,0,0,.25);
    }
    textarea:focus, input:focus{
      border-color:#2c5fb9; box-shadow: 0 0 0 4px rgba(59,130,246,.15);
    }
    .row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
    .run{
      appearance:none; cursor:pointer;
      background: linear-gradient(180deg, var(--brand), var(--brand-2));
      border:0; color:white; padding:11px 18px; border-radius:12px; font-weight:800; letter-spacing:.3px;
      box-shadow:0 10px 20px rgba(37,99,235,.35), inset 0 -2px 0 rgba(0,0,0,.25);
      transition: transform .08s ease, filter .2s ease;
    }
    .run:hover{filter:brightness(1.05)}
    .run:active{transform: translateY(1px)}
    .run:disabled{
      opacity:0.5; cursor:not-allowed; filter:grayscale(1);
    }

    .hint{color:var(--muted); font-size:12px}
    .kbd{
      display:inline-block; border:1px solid #213257; background:#0b1731; color:#cdd8ff;
      padding:1px 6px; border-radius:6px; font-weight:700
    }

    /* Loader */
    .loader-wrap{display:none; align-items:center; gap:10px; margin-left:auto}
    .loader{
      width:18px; height:18px; border-radius:50%;
      border:3px solid rgba(255,255,255,.15); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    .pulse{width:8px; height:8px; border-radius:50%;
      background: var(--ok); box-shadow: 0 0 0 rgba(16,185,129,.7); animation:pulse 1.5s infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(16,185,129,.7)}
      70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}
      100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}
    }

    /* Result JSON */
    .result{
      background: var(--code-bg);
      border:1px solid #152544; border-radius:12px;
      padding:14px; min-height:140px; white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      line-height:1.45; color:#e2ecff;
      box-shadow: inset 0 0 0 1px rgba(59,130,246,.06);
    }

    .tagbar{
      display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:12px
    }
    .tag{padding:4px 8px; border:1px solid #213257; border-radius:999px; background:#0b1731; color:#cfe1ff; font-weight:700}
    footer{opacity:.8; color:var(--muted); font-size:12px; text-align:center; padding:28px 0}

    .error{color:var(--error); background:rgba(239,68,68,.1); padding:12px; border-radius:8px; border:1px solid rgba(239,68,68,.2)}
  </style>
</head>
<body>
  <header>
  <div class="container header-compact">
    <div class="brand"><span class="dot"></span>BankAssist Utility</div>
    <nav class="nav-inline">
      <button class="tab-btn" id="btnEntity">Entity Extractor</button>
      <button class="tab-btn active" id="btnFlow">Flow Validator</button>
      <div class="api-key-wrap">
        <input type="text" id="apiKey" class="api-key-input" placeholder="OpenAI API Key" />
        <div class="api-status empty" id="apiStatus"></div>
      </div>
    </nav>
  </div>
</header>

  <main class="container">
    <div class="grid">
      <!-- Left: Inputs -->
      <section class="panel" id="entityExtractor" style="display:none">
        <header><h2>Entity Extractor</h2></header>
        <div class="body">
          <label>Flow Description</label>
          <textarea id="flowDesc" rows="3" placeholder="Paste conversation or flow notes"></textarea>

          <label>DPD Data (JSON)</label>
          <textarea id="dpdData" rows="4" placeholder='{"GetCustomerInfo": {...}, "GetAccountInfo": {...}}'></textarea>

          <label>Entity Description (JSON)</label>
          <textarea id="entityDesc" rows="4" placeholder='[{"name":"email","description":"from DPD_data.GetCustomerInfo.email"}, ...]'></textarea>

          <div class="row" style="margin-top:10px">
            <button class="run" id="runEntity">RUN ▷</button>
            <div class="hint">Tip: Press <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to run</div>
            <div class="loader-wrap" id="loaderEntity">
              <div class="loader"></div><span class="hint">Extracting…</span>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="flowValidator" style="display:block">
        <header>
          <h2>Flow Validator</h2>
        </header>
        <div class="body">
          <label>Actual Conversation</label>
          <textarea id="actualConv" rows="3" placeholder="User: ...&#10;Bot: ..."></textarea>

          <label>User Data (DPD Data, JSON)</label>
          <textarea id="userData" rows="4" placeholder='{"GetCustomerInfo": {...}, "GetAccountInfo": {...}}'></textarea>

          <label>Flow Description</label>
          <textarea id="flowDescription" rows="3" placeholder="Describe expected interaction logic"></textarea>

          <label>Entities (JSON)</label>
          <textarea id="entities" rows="3" placeholder='[{"name":"...","value":"..."}] or {}'></textarea>

          <div class="row" style="margin-top:10px">
            <button class="run" id="runFlow">RUN ▷</button>
            <div class="hint">Tip: Press <span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> to run</div>
            <div class="loader-wrap" id="loaderFlow">
              <div class="loader"></div><span class="hint">Validating…</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Right: Output -->
      <section class="panel">
        <header>
          <h2>Output</h2>
          <div class="tagbar">
            <span class="tag">JSON</span>
            <span class="tag">Pretty</span>
            <span class="tag">Copy Safe</span>
            <span class="pulse" title="Ready"></span>
          </div>
        </header>
        <div class="body">
          <pre id="result" class="result">{}</pre>
        </div>
      </section>
    </div>

    <footer>Press Ctrl+Enter to run the active tool · Enter your OpenAI API key above to get started</footer>
  </main>

  <script>
    // Default tab: Flow Validator
    const btnEntity = document.getElementById('btnEntity');
    const btnFlow   = document.getElementById('btnFlow');
    const entityPanel = document.getElementById('entityExtractor');
    const flowPanel   = document.getElementById('flowValidator');
    const resultBox = document.getElementById('result');
    const loaderEntity = document.getElementById('loaderEntity');
    const loaderFlow   = document.getElementById('loaderFlow');
    const apiKeyInput = document.getElementById('apiKey');
    const apiStatus = document.getElementById('apiStatus');
    const runEntityBtn = document.getElementById('runEntity');
    const runFlowBtn = document.getElementById('runFlow');

    // API Key management
    apiKeyInput.addEventListener('input', updateApiKeyStatus);
    function updateApiKeyStatus() {
      const hasKey = apiKeyInput.value.trim().length > 0;
      apiStatus.className = hasKey ? 'api-status filled' : 'api-status empty';
      runEntityBtn.disabled = !hasKey;
      runFlowBtn.disabled = !hasKey;
    }
    updateApiKeyStatus(); // Initial check

    function getApiKey() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        throw new Error('Please enter your OpenAI API key in the navigation bar');
      }
      return key;
    }

    function setActive(tab){
      const isFlow = tab === 'flow';
      btnFlow.classList.toggle('active', isFlow);
      btnEntity.classList.toggle('active', !isFlow);
      flowPanel.style.display = isFlow ? 'block' : 'none';
      entityPanel.style.display = isFlow ? 'none' : 'block';
    }
    btnEntity.addEventListener('click', ()=>setActive('entity'));
    btnFlow.addEventListener('click', ()=>setActive('flow'));
    setActive('flow'); // ensure default

    // Keyboard: Ctrl+Enter triggers RUN of visible panel
    document.addEventListener('keydown', (e)=>{
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
        if (flowPanel.style.display !== 'none'){ runFlowValidator(); }
        else { runEntityExtractor(); }
      }
    });

    function showLoader(which, show){
      const el = which === 'flow' ? loaderFlow : loaderEntity;
      el.style.display = show ? 'flex' : 'none';
    }

    // JSON helpers
    function extractJsonString(text) {
      if (!text) return "";
      const fenceMatch = text.match(/``````/i);
      if (fenceMatch) return fenceMatch[1].trim();
      const first = text.indexOf("{");
      const last = text.lastIndexOf("}");
      if (first !== -1 && last !== -1 && last > first) {
        return text.slice(first, last + 1).trim();
      }
      return text.trim();
    }
    function formatJsonOutput(rawJson) {
      const cleaned = extractJsonString(rawJson).replace(/^\s*json\s*(?=\{)/i, "");
      try {
        const obj = JSON.parse(cleaned);
        return JSON.stringify(obj, null, 2);
      } catch (e) {
        return cleaned || rawJson;
      }
    }
    function setResult(text){ resultBox.textContent = text; }

    // ENTITY EXTRACTOR
    runEntityBtn.addEventListener('click', runEntityExtractor);
    async function runEntityExtractor() {
      try {
        const apiKey = getApiKey();
        const flowDesc = document.getElementById('flowDesc').value;
        const dpdData = document.getElementById('dpdData').value;
        const entityDesc = document.getElementById('entityDesc').value;

        const payload = JSON.stringify({
          "messages": [
            {
              "role": "system",
              "content": "You are an intelligent data extractor.\n//API DAta is DPD_data\nYou will be given:\n1. A list of entities, each with a name and a description.\n2. A user-agent conversation.\n3. DPD_data (structured tabular data in JSON format).\n\nYour task is to extract the values for each entity strictly based on its description. The entity description will specify whether the value should be extracted from the conversation or from the DPD_data.\n\nConstraints:\n- Do NOT infer or guess values. Only extract if the data is explicitly available in either the conversation or DPD_data as per the description.\n- If the required data is not found in the specified source, mark the value as \"NOT_FOUND\".\n- If the entity description allows selecting from multiple matching records in DPD_data, you must randomly select one matching value instead of always picking the first.\n- Return the result as a JSON object with keys as entity names and values as the extracted data."
            },
            {
              "role": "user",
              "content": "Entities list:-"+entityDesc+"\nConversation:-"+flowDesc+"\nDPD data:-"+dpdData
            }
          ],
          "temperature": 0.1,
          "max_tokens": 4096,
          "top_p":0.95,
          "frequency_penalty":0,
          "presence_penalty":0,
          "stop":null
        });

        showLoader('entity', true);
        setResult('Running Entity Extractor…');
        
        const response = await fetch(
          "https://bankassisteastus2.openai.azure.com/openai/deployments/bankassist-test-gpt-4.1-2025-04-14/chat/completions?api-version=2024-02-15-preview",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "api-key": apiKey
            },
            body: payload
          }
        );
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error?.message || `API Error: ${response.status}`);
        }
        
        const raw = data?.choices?.[0]?.message?.content || "No Result";
        setResult(formatJsonOutput(raw));
      } catch(err) {
        setResult(`Error: ${err.message}`);
        resultBox.className = 'result error';
        setTimeout(() => resultBox.className = 'result', 3000);
      } finally {
        showLoader('entity', false);
      }
    }

    // FLOW VALIDATOR
    runFlowBtn.addEventListener('click', runFlowValidator);
    async function runFlowValidator() {
      try {
        const apiKey = getApiKey();
        const actualConv = document.getElementById('actualConv').value;
        const userData = document.getElementById('userData').value;
        const flowDescription = document.getElementById('flowDescription').value;
        const entities = document.getElementById('entities').value;

        const payload = JSON.stringify({
          "messages": [
            {
              "role": "system",
              "content": `
You are an AI assistant specialised in validating banking chatbot conversations.
Your task is to evaluate a conversation against the provided **flow description**, **expected entities**, and **DB data**.

---

## ⚠️ SCORE CAP RULES — Read These First

These override all other scoring. Evaluate these before computing any scores.

| # | Condition | Effect |
|---|---|---|
| CAP-1 | DB Data Accuracy score ≤ 4/10 | Overall Score hard-capped at **4/10** |
| CAP-2 | Flow Completion ≤ 5/10 AND flow is TRANSACTIONAL | Overall Score hard-capped at **5/10** |
| CAP-3 | Bot switches language mid-conversation without explicit user confirmation | Overall Score = **0/10** |
| CAP-4 | CAP-1 must NOT fire solely due to the bot displaying a structured DB field in concatenated or human-readable form | Remove cap if this was the only reason |
| CAP-5 | CAP-2 applies to TRANSACTIONAL flows only | Low confirmation scores in INFORMATIONAL flows trigger no cap |

> **CAP-3 clarification**: "Explicit confirmation" means the bot asks the user to confirm the language switch and the user agrees **before** the bot responds in the new language. A switch without this exchange triggers CAP-3.

---

## Input Data

1. A user-bot **conversation**
2. A **flow description** describing the expected interaction
3. A list of **extracted entities** from the conversation
4. A **DB dataset** representing real customer account data

---

## Step 1 — Classify Flow Type

Classify the conversation before scoring anything.

| Flow Type | When to Use |
|---|---|
| **INFORMATIONAL** | User wants to VIEW / GET / CHECK information. Bot retrieves and displays data. Providing the information IS completion — no confirmation required. |
| **TRANSACTIONAL** | User wants to UPDATE / CHANGE / MODIFY data or perform financial actions. Confirmation required before action. Acknowledgment required after completion. |
| **AMBIGUOUS** | Intent is unclear or could be either type. |

---

## Step 2 — Core Validation Rules

Each rule is defined once here. All scoring sections reference these rules — they are not repeated elsewhere.

### Rule A — DB Field Key vs. Field Value
- DB field key names (e.g., "phoneNumber", "deliveryAddressObj") are used **only to locate data** in the DB. They are never directly compared to the bot's output text.
- Only the **field value content** is compared to the bot's displayed text. The bot always converts DB key names into natural human-readable labels — this is always correct behaviour and must **never** be flagged as a mismatch.

### Rule B — Composite / Structured Fields
- DB fields stored as structured objects (e.g., address objects with sub-fields: addressline1, addressline2, addressline3, addressline4) must be validated by **concatenating all non-null sub-fields in their defined order**, then comparing the result to the bot's displayed string.
- A match on concatenated content = correct match, regardless of display format. Never penalise correct concatenation.
- Address label mappings:
  - "deliveryAddressObj" in DB = **Mailing address** as displayed by the bot
  - "permanentAddressObj" in DB = **Permanent address** as displayed by the bot

### Rule C — Terminology & Synonyms
- The bot may use terminology that is functionally equivalent, synonymous, or a human-readable conversion of any DB field key or value (e.g., "phone number" = "phoneNumber"; "current cycle balance" = "closingBalanceCC"), across all key name formats (camelCase, snake_case, abbreviated, etc.). All such conversions are correct matches.

### Rule D — Date Formats
- The bot may display dates in any valid format (DD/MM/YYYY, DD Month, DD Month YYYY, Month DD YYYY, etc.). Any format representing the same underlying date is a correct match — never penalise date format differences.

### Rule E — Account/Card Number Masking
In standard responses, account/card numbers must be masked. All of the following formats are valid:
- Suffix masking: "xxxx1234" (leading digits masked, last digits visible)
- Prefix masking: "1234xxxx" (first digits visible, trailing digits masked)
- Partial reveal: "3334xx...xx4443" (first and last few digits visible, middle masked)
- Masking characters: "x", "*", "." or any combination

**Exception**: In a "get account number" or "get card number" use case, the bot may display the full unmasked number. This is correct behaviour.

Only flag a masking violation if the full number is shown in a context where masking is expected.

### Rule F — Card Data Lookup Hierarchy
When validating any card-related field (card number, type, status, limit, expiry, etc.):

1. **Always check "cardDetails" inside "GetAccountInfo" first** — this is the mandatory primary source.
2. If the key exists in "cardDetails" but its value is null or empty → display as "N.A". Do **not** fall back to other DB fields.
3. Only fall back to other DB fields if the **key itself is entirely absent** from "cardDetails".
4. Never cross-validate card data against non-"cardDetails" DB fields if the key exists in "cardDetails".

### Rule G — Valid Account/Card Identifiers
- An account or card can be identified by full number, partial number (last 4 digits), or nickname stored in the DB. All three are valid, complete identifiers.
- Look up the DB record that matches whichever identifier was used, then validate the bot's response against that record. A confirmed match → correct match, no mismatch, no cap.
- Never treat a partial number or nickname reference as ambiguous if exactly one DB record matches.

### Rule H — Account Type Priority
- If "accountBehaviour" is populated (non-null, non-empty, non-whitespace) → use "accountBehaviour" as the account descriptor.
- If "accountBehaviour" is null, empty, or whitespace only → fall back to "accountType".

### Rule I — N.A / Null / Empty Value Handling
- **Single-account case**: If a DB field is null, empty, or ""N.A"", the bot must respond with a message like *"I could not find a [field] associated with your account"* or similar. Displaying ""N.A"" literally is also acceptable. Both earn full marks for that field.
- **Multi-account case**: If a field is null/empty/N.A for a specific account within a list, the bot displays ""N.A"" for that account in the response.
- **Opening date**: Account opening date is strictly mapped to "openingDate" in "GetAccountInfo". If "openingDate" is null/absent, apply this rule.

### Rule J — Extra Information
- If the bot displays more information than strictly requested, this is **not** a DB accuracy issue.
- All displayed values must still be individually validated against the DB.
- If all displayed values are correct → DB Accuracy = 10/10, regardless of how many extra values were shown.
- Extra information is at most a minor Flow Completion deduction (1–2 points), and only if it meaningfully diverges from the flow description.
- Never apply the DB accuracy cap because the bot showed additional correct data.

### Rule K — DB Data Sources
- "GetCustomerInfo" = user profile data. "GetAccountInfo" = user account data.
- All data comparisons are performed in the context of a logged-in user session.

### Rule L — Bot Response Absent or Malformed
- If the bot provides no response or an empty reply → Flow Completion = 0/10, Conversation Quality = 0/10.
- If raw unparsed template data (e.g., raw JSON strings) is visible in the bot's output → classify as a **Bot Issue** and deduct points in Flow Completion and Conversation Quality accordingly.

### Rule M — Multi-Account Ambiguity
- If a user has multiple accounts, the bot **must always ask the user to select a specific account** before proceeding — regardless of whether the user mentioned an account or not.
- The **only exception** is when the user's utterance itself contains an explicit all-accounts reference, including any phrasing such as "all accounts", "all my accounts", "every account", "across all accounts", or equivalent intent embedded naturally in the request. In this case, the bot must display data for all accounts without asking for selection.
- **Scoring:**
  - Bot asks for selection when user did not specify all accounts → correct behaviour, full marks ✅
  - Bot skips selection and shows all accounts when user's utterance contains an all-accounts reference → correct behaviour, full marks ✅
  - Bot skips selection when user did NOT include an all-accounts reference → Flow Completion deduction applies ❌
  - Bot asks for selection even when user's utterance already contains an all-accounts reference → unnecessary step, minor Flow Completion deduction ❌

---

## Step 3 — Scoring Dimensions

Score each dimension from 0–10. Decimals are permitted; round to 1 decimal place (e.g., 7.5, 8.0).

---

### 1. Intent Identification (0–10)
| Score | Criteria |
|---|---|
| 10 | Bot correctly identifies and responds to the user's intent |
| 7–9 | Intent mostly correct; minor misread |
| 4–6 | Intent partially recognised |
| 0–3 | Intent misunderstood or ignored |

---

### 2. Entity Extraction (0–10)
- **INFORMATIONAL flows**: If the bot retrieves the correct information, this demonstrates successful entity identification even if no explicit entity list is provided. Do not penalise for an empty entity list if the correct data was returned.
- **TRANSACTIONAL flows**: Explicit entity extraction is required.

| Score | Criteria |
|---|---|
| 10 | All required entities correctly extracted and match user input |
| 7–9 | Minor misses on optional entities |
| 4–6 | Key entities missing or partially extracted |
| 0–3 | Critical entities missing or incorrectly extracted |

---

### 3. DB Data Accuracy (0–10) — *See CAP-1 and CAP-4*
Validate using Rules A, B, C, D, F, G, H, I, J, K. Never penalise for format differences alone.

| Score | Criteria |
|---|---|
| 10 | All bot-stated values match DB data |
| 7–9 | Minor formatting differences only; underlying values are correct |
| 4 | Any factual content mismatch between bot-stated values and DB data (HARD LIMIT — triggers CAP-1) |
| 0–3 | Multiple or critical content mismatches |

---

### 4. Flow Completion (0–10) — *See CAP-2 and CAP-5*

**INFORMATIONAL:**
| Score | Criteria |
|---|---|
| 10 | Bot successfully retrieves and provides the requested information |
| 7–9 | Information provided with minor formatting issues |
| 4–6 | Information provided but with significant confusion or unnecessary steps |
| 0–3 | Failed to provide the requested information |

**TRANSACTIONAL:**

Expected steps (apply only the steps relevant to the specific flow being tested):
- Scope identification *(if the flow description requires it)*
- Account identification *(if the flow description requires it)*
- New data input capture *(if the flow description requires it)*
- Confirmation request from the bot (**always required** for transactional flows)
- Final acknowledgment/completion message (**always required** for transactional flows)

> Only penalise for a missing step if that step is logically required by the flow description. Never penalise for steps the flow description does not include.

| Score | Criteria |
|---|---|
| 10 | All applicable steps completed; confirmation and acknowledgment both present |
| 7–9 | Minor optional steps missing |
| 5 | Confirmation OR acknowledgment missing (HARD LIMIT — triggers CAP-2) |
| 0–4 | Severely broken flow, wrong sequence, or both confirmation and acknowledgment missing |

---

### 5. Confirmation & Acknowledgment (0–10)

**INFORMATIONAL:**
| Score | Criteria |
|---|---|
| 10 | Bot provides requested information clearly; no confirmation needed |
| 7–9 | Information provided with minor clarity issues |
| 0–3 | Bot unnecessarily requests confirmation for a simple retrieval |

**TRANSACTIONAL:**
| Score | Criteria |
|---|---|
| 10 | Bot requests confirmation before action AND provides final acknowledgment after |
| 7–9 | Either confirmation or acknowledgment present, but not both |
| 4–6 | Generic confirmation without specifics |
| 0–3 | No confirmation or acknowledgment |

---

### 6. Data Masking & Security (0–10) — *See Rule E*
| Score | Criteria |
|---|---|
| 10 | Account/card numbers properly masked in any accepted format (see Rule E) |
| 7–9 | Mostly masked with minor exposure |
| 0–3 | Full number exposed without masking in a context where masking is expected |

---

### 7. Conversation Quality (0–10)
| Score | Criteria |
|---|---|
| 10 | Natural, fluent, and engaging |
| 7–9 | Mostly natural with minor issues |
| 4–6 | Noticeable awkwardness or confusion |
| 0–3 | Unnatural, stilted, or confusing. Also applies if bot provides no response (see Rule L) |

> **Note**: Conversation Quality is reported separately and does not factor into the weighted formula below.

---

## Step 4 — Overall Score Formula


Overall Score = (
    Intent_Identification  × 0.15 +
    Entity_Extraction      × 0.15 +
    DB_Data_Accuracy       × 0.30 +
    Flow_Completion        × 0.25 +
    Confirmation           × 0.10 +
    Data_Masking           × 0.05
)


After computing the formula result, apply any triggered Score Cap Rules (from the top of this prompt) in order. Use the capped value as the final Overall Score.

---

## Step 5 — Issue Type Classification

Select all that apply. If more than one applies, list all in the "issue_type" array.

1. **Bot Issue** — Wrong response templates, incorrect branching logic, missing responses, raw JSON visible in output, incorrect system constraints
2. **NLP Issue** — Intent misclassification, entity extraction failures, incorrect entity mapping, language understanding problems
3. **DB Data Mismatch** — Bot states values not matching DB, incorrect data retrieval, data synchronisation issues
4. **Flow Description Needs Update** — Flow description is inconsistent, illogical, or unclear
5. **Integration Issue** — Failed API calls or data retrieval failures
6. **No Issue / Pass** — Conversation meets all criteria

## Step 6 — Pre-Output Self-Consistency Checklist (Mandatory Before Writing JSON)

Run all six checks internally before writing JSON. If any check reveals a contradiction, **fix the score** — never document corrections in the reason field. Never write "Correction:", "Actually,", or "The score should be..." in a reason field.

| # | Check | Rule |
|---|---|---|
| 1 | Score vs. Reason: bot correct / no violations → score ≥ 7. Critical violation found → score reflects applicable cap. If the reason text states correct data but concludes it is wrong — that is a self-contradiction. Trust the stated facts, fix the conclusion. | Always |
| 2 | No contradiction phrases in reason field ("Correction:", "Actually,", "There is no mismatch, but...") — fix the score instead. | Always |
| 3 | Score cap applied? Confirm it is justified by a **content-level** violation, not a format or display difference. If format-only → remove cap (CAP-4). | If cap applied |
| 4 | DB fields validated by **value content**, not structural format. Concatenated address, human-readable date, synonym terminology, and human-readable field labels are all correct matches. | DB Accuracy |
| 5 | Account/card referenced by partial number or nickname? Look up the matching DB record (Rule G). Match confirmed → no mismatch, no cap. | If partial/nickname used |
| 6 | Bot showed extra information? Validate all displayed values. All correct → DB Accuracy = 10/10, no cap (Rule J). | If extra info shown |

## Evaluation Order

Execute these steps in sequence:

1. Classify flow type → Step 1
2. Identify relevant Core Validation Rules → Step 2
3. Score each dimension independently → Step 3
4. Compute Overall Score using the formula → Step 4
5. Apply any triggered Score Cap Rules
6. Classify issue type(s) → Step 5
7. Run Self-Consistency Checklist → Step 6
8. Output final JSON

---

> **Final Reminder**: Display format differences (concatenated fields, human-readable labels, date formats, synonyms) are never DB mismatches. The DB accuracy cap triggers only on confirmed content-value differences.
